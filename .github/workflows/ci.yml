name: ci

# SDK testlari KONTRAKT fixture'laridan oziqlanadi — usiz ular ma'nosiz.
#
# ⚠ NEGA VENDOR NUSXASI, teg emas: bu repo PUBLIC, `davirixai/contracts` esa
# PRIVATE. Public repo'ning default `GITHUB_TOKEN` i bir tashkilotdagi private
# repoga KIRA OLMAYDI — avvalgi konfiguratsiya aynan shu sababdan yiqilgan
# ("Repository not found"). Nusxa CI'ni o'z-o'ziga yetarli qiladi va tashqi
# hissa qo'shuvchi ham testlarni yurgiza oladi.
#
# ⚠ BU YERDA YASHIL BO'LISH «KONTRAKTGA MOS» DEGANI EMAS:
#   bu CI  → nusxa BUZILMAGANINI tekshiradi (digest);
#   kanonik tekshiruv → monorepoda, `contracts/` yonida:
#       python scripts/verify_vendor.py --canonical <contracts>
# Ikki savolni aralashtirish drift'ni yashirardi, shuning uchun ular ayri.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Haftalik: kod o'zgarmasa ham yashilligi tekshiriladi.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - name: Vendor nusxasi butunmi (digest)
        run: python scripts/verify_vendor.py

      - name: Testlar (kontrakt fixture'lari bilan)
        env:
          DAVIRIX_CONTRACTS_DIR: ${{ github.workspace }}/tests/contracts
        run: pytest -q

      - name: Mutatsiya sinovi (qoidalar haqiqatan qo'riqlanadimi)
        if: matrix.python-version == '3.12'
        env:
          DAVIRIX_CONTRACTS_DIR: ${{ github.workspace }}/tests/contracts
        run: python scripts/mutation_check.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # ⚠ `twine check` README'ning PyPI'da renderlanishini tekshiradi —
      # nashrdan KEYIN aniqlangan render xatosini tuzatib bo'lmaydi.
      - run: twine check dist/*
